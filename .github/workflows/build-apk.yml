name: Build Joanakar Techno Engine APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK instalable
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK descargable
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Joanakar-Techno-Engine.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Joanakar-Techno-Engine.apk
          git commit -m "APK instalable actualizado [skip ci]" || exit 0
          git push

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Joanakar-Techno-Engine-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
